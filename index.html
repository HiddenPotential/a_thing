<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Personal Site</title>
  <meta name="description" content="Personal website">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Apply saved theme before paint to avoid a flash.
    try {
      const t = localStorage.getItem("theme");
      if (t) document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <header class="nav">
    <a class="brand" href="#top" id="brand"></a>
    <nav>
      <a href="#about">About</a>
      <a href="#experience">Experience</a>
      <a href="#projects">Projects</a>
      <a href="#contact">Contact</a>
      <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </nav>
  </header>

  <main id="top">
    <section class="hero">
      <div class="avatar" id="avatar"></div>
      <p class="eyebrow" id="role-line"></p>
      <h1 id="name"></h1>
      <p class="tagline" id="tagline"></p>
      <div class="cta">
        <a class="btn primary" id="email-btn" href="#">Get in touch</a>
        <a class="btn" id="resume-btn" href="#" target="_blank" rel="noopener">Résumé</a>
      </div>
      <ul class="links" id="hero-links"></ul>
    </section>

    <section id="about" class="section reveal">
      <h2>About</h2>
      <div class="about-grid">
        <div id="about-text"></div>
        <ul class="chips" id="skills"></ul>
      </div>
    </section>

    <section id="experience" class="section reveal">
      <h2>Experience</h2>
      <ol class="timeline" id="timeline"></ol>
    </section>

    <section id="projects" class="section reveal">
      <h2>Projects</h2>
      <div class="cards" id="cards"></div>
    </section>

    <section id="contact" class="section contact reveal">
      <h2>Let's talk</h2>
      <p>I'm always happy to chat about new ideas, collaborations, or opportunities.</p>
      <a class="email-big" id="email-big" href="#"></a>
    </section>
  </main>

  <footer class="footer">
    <span id="footer-text"></span>
  </footer>

  <script src="profile.js"></script>
  <script src="script.js"></script>
</body>
</html>
