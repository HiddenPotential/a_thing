<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Website</title>
  <meta name="description" content="My personal website">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Patrick+Hand&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>
    try {
      const t = localStorage.getItem("theme");
      if (t) document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <header class="nav">
    <a class="brand" href="#top" id="brand"></a>
    <nav>
      <a href="#about">About</a>
      <a href="#favorites">Faves</a>
      <a href="#projects">Projects</a>
      <a href="#goals">Goals</a>
      <button class="theme-toggle" id="theme-toggle" aria-label="Switch to chalkboard mode" title="Switch theme">
        <span class="icon-sun">☀️</span><span class="icon-moon">🌙</span>
      </button>
    </nav>
  </header>

  <main id="top">
    <section class="hero">
      <div class="photo-frame">
        <span class="tape"></span>
        <div class="avatar" id="avatar"></div>
      </div>
      <div class="hero-text">
        <p class="hi" id="hi"></p>
        <h1><span class="highlight" id="name"></span></h1>
        <p class="badge" id="grade"></p>
        <p class="tagline" id="tagline"></p>
        <ul class="links" id="hero-links"></ul>
      </div>
      <svg class="doodle star" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 8 61 38 93 39 68 59 77 91 50 72 23 91 32 59 7 39 39 38Z"/></svg>
      <svg class="doodle squiggle" viewBox="0 0 200 40" aria-hidden="true"><path d="M5 20 Q 25 0 45 20 T 85 20 T 125 20 T 165 20 T 195 20"/></svg>
    </section>

    <section id="about" class="section reveal">
      <h2>About Me</h2>
      <div class="about-grid">
        <div class="paper" id="about-text"></div>
        <div class="sticky yellow">
          <h3>Stuff I'm learning</h3>
          <ul class="chips" id="learning"></ul>
        </div>
      </div>
    </section>

    <section id="favorites" class="section reveal">
      <h2>My Favorite Things</h2>
      <div class="faves" id="faves"></div>
    </section>

    <section id="year" class="section reveal">
      <h2>My Year So Far</h2>
      <ol class="timeline" id="timeline"></ol>
    </section>

    <section id="projects" class="section reveal">
      <h2>Stuff I Made</h2>
      <div class="cards" id="cards"></div>
    </section>

    <section id="goals" class="section reveal">
      <h2>Goals</h2>
      <ul class="checklist paper" id="checklist"></ul>
    </section>
  </main>

  <footer class="footer">
    <span id="footer-text"></span>
  </footer>

  <script src="profile.js"></script>
  <script src="script.js"></script>
  <script src="eggs.js"></script>
</body>
</html>
