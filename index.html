<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Website</title>
  <meta name="description" content="My personal website">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Patrick+Hand&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>
    try {
      const t = localStorage.getItem("theme");
      if (t) document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <header class="nav">
    <a class="brand" href="#top" id="brand"></a>
    <button class="theme-toggle" id="theme-toggle" aria-label="Switch to chalkboard mode" title="Switch theme">
      <span class="icon-sun">☀️</span><span class="icon-moon">🌙</span>
    </button>
  </header>

  <main id="top">
    <section class="hero">
      <div class="photo-frame"><div class="avatar" id="avatar"></div></div>
      <p class="hi" id="hi"></p>
      <h1><span class="highlight" id="name"></span></h1>
      <p class="grade" id="grade"></p>
      <p class="tagline" id="tagline"></p>
      <ul class="links" id="hero-links"></ul>
      <svg class="doodle star" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 8 61 38 93 39 68 59 77 91 50 72 23 91 32 59 7 39 39 38Z"/></svg>
    </section>

    <section id="about" class="section">
      <h2>About Me</h2>
      <div class="paper" id="about-text"></div>
    </section>

    <section id="activities" class="section">
      <h2>Things I Do</h2>
      <div class="activities" id="activities-list"></div>
    </section>

    <section id="favorites" class="section">
      <h2>My Favorite Things</h2>
      <div class="faves" id="faves"></div>
    </section>

    <section id="projects" class="section">
      <h2>Stuff I Made</h2>
      <div class="cards" id="cards"></div>
    </section>
  </main>

  <footer class="footer">
    <span id="footer-text"></span>
  </footer>

  <script src="profile.js"></script>
  <script src="script.js"></script>
  <script src="eggs.js"></script>
</body>
</html>
